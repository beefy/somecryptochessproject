# Two static origins behind one Caddy terminator:
#
#   app.proofofchess.com  -> :8080, the web app, /v1 and /relay
#   proofofchess.com      -> :8081, the apex landing page
#
# The app is one bundle over one release directory because every view is a hash
# route (`#/`, `#/wallet`, `#/play`, `#/dex`, `#/bridge`); nothing here needs to
# know which view a request is for. The landing page is a separate, plain HTML
# release so it renders without the app's JavaScript and can change on its own.
#
# Neither server is public. Caddy (the `tls` service in docker-compose.yml) owns
# :80 and :443, terminates TLS and proxies here on loopback, so the same
# locations serve http and https without a second copy of this file.
#
# Both proxies on :8080 exist because the node sends no CORS headers: a page
# served from one origin cannot read /v1 on another. Keeping the relay behind
# /relay as well means `#/play` needs neither a public 8646 nor `--origin` on the
# relay.
#
# Paths match what the workflow builds: VITE_SCCP_API empty (same origin) and
# VITE_SCCP_RELAY=/relay, so the bundle calls /v1/... and /relay/v1/... here.

# Caddy reports the scheme the browser actually used; $scheme here is always
# http, which would tell the node every request arrived in the clear.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 127.0.0.1:8080;
    # The public name is a DNS record and Caddy's concern; the block answers any
    # Host so a curl of the loopback port works for smoke tests.
    server_name _;

    # `current` is the symlink the deploy switches. nginx resolves it per request
    # and follows it outside the bind mount, so a new release is live the moment
    # the symlink moves, with no container restart. The app and the landing page
    # have independent current links and independent releases.
    root /srv/app/current;
    index index.html;

    # The bundle is a few hundred KB of JS; the page is unusable before it loads.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames: the content behind a name never changes, so it can be
    # cached forever. A new deploy writes new names.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The node API. No CORS headers: same origin, so the browser needs none.
    location /v1/ {
        proxy_pass http://127.0.0.1:8645;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    # The matchmaker, reached by the page as /relay/v1/... with the prefix
    # stripped. Same origin again, so no preflight and no --origin allowlist.
    location /relay/ {
        proxy_pass http://127.0.0.1:8646/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Hash routing (#/blocks/12), so every route is this one document, and it
    # must not be cached: a stale index.html points at assets that a deploy
    # replaced.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # TLS lives in Caddy in front of this server, so there is nothing to add
    # here: keep this block on loopback and let the terminator own :80/:443.
}

# The apex landing page. It has no API proxy: the page is static, and every
# interactive action links to app.proofofchess.com. Serving it from a separate
# listener means a landing-only deploy cannot invalidate the app release (or
# vice versa), while both still ride the same nginx container and Caddy cert.
server {
    listen 127.0.0.1:8081;
    server_name _;

    root /srv/landing/current;
    index index.html;

    gzip on;
    gzip_types text/css image/svg+xml;
    gzip_min_length 1024;

    # These filenames are stable rather than content-hashed, so a short cache is
    # the right trade: a deploy is visible without a hard refresh, and repeat
    # visits do not refetch a few KB on every page load.
    location ~* \.(?:css|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The landing page is a single document, not a hash-routed app. An unknown
    # path is a 404 rather than a silently aliased home page.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
