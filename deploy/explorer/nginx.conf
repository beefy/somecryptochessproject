# The explorer's origin: the uploaded release on /, the node API on /v1 and the
# matchmaker on /relay.
#
# This server is not public. Caddy (the `tls` service in docker-compose.yml)
# owns :80 and :443, terminates TLS and proxies here on loopback, so the same
# locations serve http and https without a second copy of this file.
#
# Both proxies exist because the node sends no CORS headers: a page served from
# one origin cannot read /v1 on another. Keeping the relay behind /relay as well
# means `#/play` needs neither a public 8646 nor `--origin` on the relay.
#
# Paths match what the workflow builds: VITE_SCCP_API empty (same origin) and
# VITE_SCCP_RELAY=/relay, so the bundle calls /v1/... and /relay/v1/... here.

# Caddy reports the scheme the browser actually used; $scheme here is always
# http, which would tell the node every request arrived in the clear.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 127.0.0.1:8080;
    # The public name is a DNS record and Caddy's concern; the block answers any
    # Host so a curl of the loopback port works for smoke tests.
    server_name _;

    # `current` is the symlink the deploy switches. nginx resolves it per request
    # and follows it outside the bind mount, so a new release is live the moment
    # the symlink moves, with no container restart.
    root /srv/current;
    index index.html;

    # The bundle is a few hundred KB of JS; the page is unusable before it loads.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames: the content behind a name never changes, so it can be
    # cached forever. A new deploy writes new names.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The node API. No CORS headers: same origin, so the browser needs none.
    location /v1/ {
        proxy_pass http://127.0.0.1:8645;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    # The matchmaker, reached by the page as /relay/v1/... with the prefix
    # stripped. Same origin again, so no preflight and no --origin allowlist.
    location /relay/ {
        proxy_pass http://127.0.0.1:8646/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Hash routing (#/blocks/12), so every route is this one document, and it
    # must not be cached: a stale index.html points at assets that a deploy
    # replaced.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # TLS lives in Caddy in front of this server, so there is nothing to add
    # here: keep this block on loopback and let the terminator own :80/:443.
}
