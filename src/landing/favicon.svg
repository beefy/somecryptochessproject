<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The apex landing page's mark: the same four centre squares as the app icon,
    with a knight cut out of the dark half. The board stays legible at 16px and
    the silhouette gives the landing page its own identity.
  -->
  <title>Proof of Chess</title>
  <defs>
    <clipPath id="board-disc">
      <circle cx="32" cy="32" r="32" />
    </clipPath>
    <clipPath id="knight">
      <path
        transform="translate(8 8) scale(2)"
        d="M19 22H5v-2h14v2M13 2c-1.25 0-2.42.62-3.11 1.66L7 8l2 2 2.06-1.37c.44-.31 1.08-.19 1.39.27.02.03.05.06.05.1.3.59.19 1.3-.28 1.77l-4.8 4.8c-.55.56-.55 1.46.01 2.01.26.26.62.42.99.42H17V6a4 4 0 0 0-4-4Z"
      />
    </clipPath>
  </defs>
  <g clip-path="url(#board-disc)">
    <rect width="64" height="64" fill="#e9e2d0" />
    <rect x="32" width="32" height="32" fill="#38634f" />
    <rect y="32" width="32" height="32" fill="#38634f" />
    <g clip-path="url(#knight)">
      <rect width="64" height="64" fill="#f7f0df" />
    </g>
  </g>
  <circle cx="32" cy="32" r="31.25" fill="none" stroke="#172019" stroke-opacity="0.28" stroke-width="1.5" />
</svg>
