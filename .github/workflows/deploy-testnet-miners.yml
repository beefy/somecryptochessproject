name: deploy-testnet-miners

# Runs on every merge to main: builds the stack image, then (when a target is
# configured) resets and redeploys the two-miner testnet over SSH.
#
# Required repository configuration:
#   vars.TESTNET_DEPLOY_HOST     user@host of the deployment VM
#                                current deployment: sccp@testnet.somecryptochessproject.com
#   secrets.TESTNET_SSH_KEY      private key with docker access on that host
#   vars.TESTNET_DEPLOY_DIR      optional; defaults to /opt/sccp-testnet
#   vars.TESTNET_DEPLOY_PORT     optional; defaults to 22
#   vars.TESTNET_PUBLIC_URL      optional; defaults to the current testnet URL
#   secrets.TESTNET_KNOWN_HOSTS  optional pinned host key; without it the
#                                workflow learns the key with ssh-keyscan
#
# The package visibility must let the VM read it, or the remote docker login
# below uses a token with packages:read (the job's GITHUB_TOKEN).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-testnet
  cancel-in-progress: false

jobs:
  build:
    name: build and push the stack image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the image name
        id: image
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.base }}:testnet
            ${{ steps.image.outputs.base }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: redeploy two miners
    needs: build
    # A repository without a deployment target still gets a green image build;
    # set vars.TESTNET_DEPLOY_HOST to turn the remote job on.
    if: ${{ vars.TESTNET_DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    environment:
      name: testnet
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ vars.TESTNET_DEPLOY_HOST }}
      DEPLOY_DIR: ${{ vars.TESTNET_DEPLOY_DIR || '/opt/sccp-testnet' }}
      DEPLOY_PORT: ${{ vars.TESTNET_DEPLOY_PORT || '22' }}
      PUBLIC_URL: ${{ vars.TESTNET_PUBLIC_URL || 'http://testnet.somecryptochessproject.com:8645' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:testnet" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TESTNET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.TESTNET_KNOWN_HOSTS }}
        run: |
          set -eu
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::TESTNET_SSH_KEY is not configured"
            exit 1
          fi
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          host="${TARGET#*@}"
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$host" >> "$HOME/.ssh/known_hosts"
          fi
          user="${TARGET%%@*}"
          if [ "$user" = "$TARGET" ]; then user=root; fi
          {
            echo "Host testnet"
            echo "  HostName $host"
            echo "  User $user"
            echo "  Port $DEPLOY_PORT"
            echo "  IdentityFile $HOME/.ssh/id_ed25519"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } >> "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Upload the compose file
        run: |
          set -eu
          ssh testnet "mkdir -p '$DEPLOY_DIR'"
          scp docker-compose.yml testnet:"$DEPLOY_DIR/docker-compose.yml"

      - name: Reset and deploy the stack
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          printf '%s' "$GHCR_TOKEN" |
            ssh testnet "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh testnet "cd '$DEPLOY_DIR' \
            && SCCP_IMAGE='$IMAGE' docker compose down -v --remove-orphans \
            && SCCP_IMAGE='$IMAGE' docker compose pull \
            && SCCP_IMAGE='$IMAGE' docker compose up -d --no-build --remove-orphans"

      - name: Wait for the bootstrap chain and relay
        run: |
          set -eu
          ssh testnet "cd '$DEPLOY_DIR' \
            && SCCP_IMAGE='$IMAGE' docker compose exec -T node \
              python /app/deploy/check_testnet_stack.py \
                --node http://127.0.0.1:8645 \
                --relay http://relay:8646 \
                --wait-seconds 300"

      - name: Verify the public testnet endpoint
        run: |
          set -euo pipefail
          curl -fsS --retry 12 --retry-delay 5 --retry-connrefused --max-time 20 \
            "$PUBLIC_URL/v1/status" | jq -e '.network == "testnet"'

      - name: Show service state
        if: always()
        run: |
          ssh testnet "cd '$DEPLOY_DIR' && SCCP_IMAGE='$IMAGE' docker compose ps" || true
          ssh testnet "cd '$DEPLOY_DIR' && SCCP_IMAGE='$IMAGE' docker compose logs --tail=80 bootstrap relay" || true
