name: publish

# Publishes the package to PyPI when a GitHub release is published, and to
# TestPyPI on demand (Actions -> publish -> Run workflow).
#
# Authentication uses PyPI Trusted Publishing (OIDC): no API tokens or secrets
# are stored in the repository. One-time setup on PyPI/TestPyPI under
# "Publishing" -> "Add a new pending publisher":
#
#   PyPI project name : sccp
#   Owner             : beefy
#   Repository name   : somecryptochessproject
#   Workflow name     : publish.yml
#   Environment name  : pypi   (testpypi for TestPyPI)
#
# Release checklist: bump `version` in pyproject.toml and `__version__` in
# src/sccp/version.py, then tag `v<version>` and publish the GitHub release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Index to publish to"
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # twine 7+ reads Metadata-Version 2.5, which current hatchling emits
          # (twine 6 / pkginfo rejects it with "InvalidDistribution"). PyPI
          # itself accepts 2.5.
          python -m pip install "build>=1.2,<2" "twine>=7,<8"

      - name: Check version consistency
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release_version.py

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Typecheck
        run: mypy

      - name: Test (whole-package coverage gate, 85%)
        # coverage.py's --cov-fail-under applies to the union of everything that
        # was measured, so combining --cov=sccp with the narrower --cov=sccp.crypto
        # / --cov=sccp.serialization sources would silently demand 95% for the
        # whole package. the project defines two coverage gates --
        # overall >= 85% and crypto/ + serialization.py >= 95% -- so keep them
        # separate, exactly like the ci workflow does.
        run: pytest --cov=sccp --cov-report=term-missing --cov-fail-under=85

      - name: Coverage gate (crypto and serialization >= 95%)
        run: pytest -q --cov=sccp.crypto --cov=sccp.serialization --cov-fail-under=95

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check --strict dist/*

      - name: Smoke-test the built wheel
        env:
          SCCP_WALLET_PASSPHRASE: wheel-smoke-test
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --quiet --upgrade pip
          /tmp/wheel-venv/bin/pip install --quiet dist/*.whl
          /tmp/wheel-venv/bin/sccp --version
          /tmp/wheel-venv/bin/sccp wallet new --network testnet --out /tmp/smoke.key
          /tmp/wheel-venv/bin/sccp wallet address --key /tmp/smoke.key

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sccp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          print-hash: true
          skip-existing: true  # re-running a dry run for the same version is fine

  publish-pypi:
    name: publish to PyPI
    needs: build
    if: >-
      ${{ (github.event_name == 'release' && !github.event.release.prerelease)
      || (github.event_name == 'workflow_dispatch' && inputs.repository == 'pypi') }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sccp
    permissions:
      id-token: write  # mandatory for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
          # PEP 740 attestations are generated by default (Sigstore + OIDC);
          # they appear on the PyPI "Provenance" tab of the uploaded files.
