name: deploy-edge

# Publishes the read-only mirror node (deploy/edge/) to its own VM.
#
# This runs *after* deploy-testnet-miners rather than beside it. The mirror has
# to run the image that deployment just published, and `workflow_run` is the only
# trigger that knows the build finished: a second path-triggered workflow on the
# same push would race the image push and could pull a tag that does not exist
# yet (or, worse, the previous commit's). The commit it deploys is therefore
# `workflow_run.head_sha`, not whatever `main` points at when the job starts.
#
# Nothing here creates the VM, its address or its firewall: those stay manual and
# deliberate (deploy/edge/README.md). This job ships the project, pulls the tag
# the primary just built, resets the replica only when the primary's chain was
# replaced, and proves the mirror advanced.
#
# Required configuration. Set these as repository variables, or on the `testnet`
# environment the job declares — the workflow reads them inside a step, so either
# scope works. Leaving EDGE_DEPLOY_HOST unset is allowed: the job still runs and
# reports "no mirror configured" instead of skipping with no log at all.
#   vars.EDGE_DEPLOY_HOST     user@host of the mirror VM; unset = no mirror and
#                             this job is skipped
#   vars.EDGE_DOMAIN          the mirror's public name, e.g. mirror.proofofchess.com
#   secrets.EDGE_SSH_KEY      private key for that user; falls back to TESTNET_SSH_KEY
#   secrets.EDGE_KNOWN_HOSTS  optional pinned host key; falls back to
#                             TESTNET_KNOWN_HOSTS, else ssh-keyscan
#   vars.EDGE_DEPLOY_DIR      optional; defaults to /srv/sccp-edge
#   vars.EDGE_DEPLOY_PORT     optional; defaults to 22
#   vars.EDGE_PRIMARY_URL     optional; defaults to https://app.proofofchess.com
#   vars.EDGE_SSH_PROXY_JUMP  optional; "1" forces the jump through
#                             TESTNET_DEPLOY_HOST, "0" forces a direct connection.
#                             Unset tries the jump first and falls back, which is
#                             the only route a GitHub-hosted runner has to a
#                             mirror with no public SSH (see the ProxyJump
#                             section below)
on:
  workflow_run:
    workflows: ["deploy-testnet-miners"]
    types: [completed]
    # Only main: a dispatched deploy of a feature branch must not repoint the
    # public mirror at an unmerged commit.
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: testnet)"
        type: string
        required: false
        default: testnet

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-edge
  cancel-in-progress: false

jobs:
  deploy:
    name: redeploy the mirror node
    # Gated on the event only. A failed primary deploy is a real skip: the mirror
    # keeps its previous image rather than following a commit that never shipped.
    # A *missing target* is not a skip. A job stopped by `if` has no steps and no
    # log, so "no mirror configured" looks exactly like "this workflow is broken";
    # the configuration step below decides that, and says which variable is unset.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: testnet
    env:
      # The primary deploy builds `:${sha}` and `:testnet` from the same commit.
      # Preferring the sha keeps this mirror exactly on the commit that shipped
      # even if `:testnet` has since moved.
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.event.workflow_run.head_sha || 'testnet' }}
    steps:
      # Configuration is resolved in a step, never in the job-level `if` or `env`:
      # those are evaluated before `environment:` is applied, so a variable scoped
      # to the `testnet` environment reads as empty and the job vanishes silently.
      - name: Read the mirror configuration
        id: target
        env:
          MIRROR: ${{ vars.EDGE_DEPLOY_HOST }}
          MIRROR_DOMAIN: ${{ vars.EDGE_DOMAIN }}
          DIR_VAR: ${{ vars.EDGE_DEPLOY_DIR }}
          PORT_VAR: ${{ vars.EDGE_DEPLOY_PORT }}
          PRIMARY_URL_VAR: ${{ vars.EDGE_PRIMARY_URL }}
          JUMP_VAR: ${{ vars.EDGE_SSH_PROXY_JUMP }}
        run: |
          set -eu
          dir="${DIR_VAR:-/srv/sccp-edge}"
          port="${PORT_VAR:-22}"
          # GHCR names are lowercase; `${x,,}` would be shorter but is bash 4+.
          repo="$(printf '%s' "${GITHUB_REPOSITORY:-}" | tr '[:upper:]' '[:lower:]')"
          if [ -z "${MIRROR:-}" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice file=deploy/edge/README.md::no mirror configured: vars.EDGE_DEPLOY_HOST is unset, nothing to deploy"
            {
              echo "## No mirror node configured"
              echo
              echo '`vars.EDGE_DEPLOY_HOST` is empty, so this run had nothing to do.'
              echo 'Set it and `vars.EDGE_DOMAIN` to deploy `deploy/edge/`; see'
              echo '[`deploy/edge/README.md`](../blob/main/deploy/edge/README.md).'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${MIRROR_DOMAIN:-}" ]; then
            echo "::error::vars.EDGE_DOMAIN is unset, so Caddy has no certificate name"
            exit 1
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          {
            echo "TARGET=$MIRROR"
            echo "DEPLOY_DIR=$dir"
            echo "DEPLOY_PORT=$port"
            echo "DOMAIN=$MIRROR_DOMAIN"
            echo "PRIMARY_URL=${PRIMARY_URL_VAR:-https://app.proofofchess.com}"
            echo "JUMP=${JUMP_VAR:-}"
            echo "IMAGE=ghcr.io/$repo:${IMAGE_TAG}"
          } >> "$GITHUB_ENV"
          echo "mirror: $MIRROR:$port -> https://$MIRROR_DOMAIN, data in $dir"
          echo "image:  ghcr.io/$repo:${IMAGE_TAG}"

      - uses: actions/checkout@v4
        if: steps.target.outputs.deploy == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # --- SSH -----------------------------------------------------------------
      # The mirror VM has no public 22 by design (deploy/edge/README.md): its
      # only inbound rules are 80/443 plus IAP and the primary's tag. Two ways to
      # reach it from a GitHub-hosted runner, tried in that order:
      #
      #   * jump through TESTNET_DEPLOY_HOST, which is the posture this repository
      #     documents. The mirror's address only has to mean something inside the
      #     VPC, one firewall rule (primary tag -> mirror tag, tcp:22) has to
      #     exist, and the mirror's own key has to be authorized on it.
      #   * connect directly to EDGE_DEPLOY_HOST, which needs a self-hosted runner
      #     inside the network or a deliberately widened rule.
      #
      # The jump is tried first and the direct scan only runs when it finds no
      # key, so neither posture needs a variable to be set. `=1` and `=0` force
      # one route, mostly to test that the other still works.
      - name: Configure SSH
        if: steps.target.outputs.deploy == 'true'
        env:
          SSH_KEY: ${{ secrets.EDGE_SSH_KEY || secrets.TESTNET_SSH_KEY }}
          # The jump authenticates to *the primary* before it reaches the mirror,
          # and the primary trusts the deploy key rather than the mirror's. One
          # IdentityFile for both Host blocks made the hop impossible whenever the
          # two keys differed -- which is the arrangement this repository ships.
          PRIMARY_KEY: ${{ secrets.TESTNET_SSH_KEY }}
          # The pinned file falls back to the primary's, so the fallback says
          # nothing about the mirror; only a deliberate EDGE_KNOWN_HOSTS can.
          EDGE_PIN: ${{ secrets.EDGE_KNOWN_HOSTS }}
          KNOWN_HOSTS: ${{ secrets.EDGE_KNOWN_HOSTS || secrets.TESTNET_KNOWN_HOSTS }}
          PRIMARY_TARGET: ${{ vars.TESTNET_DEPLOY_HOST }}
          PRIMARY_PORT: ${{ vars.TESTNET_DEPLOY_PORT || '22' }}
        run: |
          set -eu

          # Every failure below names its cause. This step first shipped as a
          # straight run of commands under `set -e` ending in an unguarded
          # `ssh-keyscan`, so a mirror with no route failed the job five seconds
          # later -- ssh-keyscan's default timeout -- with "exit code 1" and no
          # other text: indistinguishable from a broken workflow rather than a
          # missing variable, and the reason this job looked unreliable.
          fail() {
            echo "::error::$1"
            exit 1
          }

          [ -n "${SSH_KEY:-}" ] ||
            fail "neither EDGE_SSH_KEY nor TESTNET_SSH_KEY is configured"

          # `user@host` is what the readers below split; a bare host would be
          # written out as a user with no HostName, and ssh would then look for
          # a machine called "root".
          case "${TARGET:-}" in
            *@?*) ;;
            *) fail "vars.EDGE_DEPLOY_HOST must be user@host, not '${TARGET:-}'" ;;
          esac
          edge_host="${TARGET#*@}"
          case "$edge_host" in
            \[*\]) ;;
            *:*) fail "vars.EDGE_DEPLOY_HOST must not carry a port ('$TARGET'); set vars.EDGE_DEPLOY_PORT" ;;
          esac

          # Which routes are allowed. `mode` is what the operator asked for; the
          # `route` chosen further down is the one that answered. An unset flag
          # means "try the jump, fall back to a direct connection", because a
          # jump host that exists is the only route a GitHub-hosted runner has to
          # a mirror with no public SSH -- and demanding a second variable for it
          # produced a run that scanned a filtered address and then failed on a
          # setting the operator had never configured.
          case "${JUMP:-}" in
            1 | true | yes | on) mode=jump ;;
            0 | false | no | off) mode=direct ;;
            "") mode=any ;;
            *) fail "vars.EDGE_SSH_PROXY_JUMP must be 1 or 0, not '$JUMP'" ;;
          esac
          if [ "$mode" = jump ] && [ -z "${PRIMARY_TARGET:-}" ]; then
            fail "vars.EDGE_SSH_PROXY_JUMP is set but vars.TESTNET_DEPLOY_HOST is empty, so there is no host to jump through"
          fi
          jumpable=false
          if [ "$mode" != direct ] && [ -n "${PRIMARY_TARGET:-}" ]; then jumpable=true; fi

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_edge"
          chmod 600 "$HOME/.ssh/id_edge"
          primary_key="$HOME/.ssh/id_edge"
          if [ -n "${PRIMARY_KEY:-}" ]; then
            printf '%s\n' "$PRIMARY_KEY" > "$HOME/.ssh/id_primary"
            chmod 600 "$HOME/.ssh/id_primary"
            primary_key="$HOME/.ssh/id_primary"
          fi

          # alias, user@host, port, identity file, extra config line
          host_block() {
            user="${2%%@*}"; name="${2#*@}"
            if [ "$user" = "$2" ]; then user=root; fi
            {
              echo "Host $1"
              echo "  HostName $name"
              echo "  User $user"
              echo "  Port $3"
              echo "  IdentityFile $4"
              echo "  IdentitiesOnly yes"
              echo "  StrictHostKeyChecking yes"
              # A runner has nobody at the keyboard: fail on a passphrase rather
              # than wait for one, and bound a connect that would otherwise sit
              # on a dropped SYN until the job times out.
              echo "  BatchMode yes"
              echo "  ConnectTimeout 15"
              if [ -n "${5:-}" ]; then echo "  $5"; fi
            } >> "$HOME/.ssh/config"
          }

          host_block primary "${PRIMARY_TARGET:-placeholder@127.0.0.1}" "$PRIMARY_PORT" \
            "$primary_key" ""

          # `ssh-keygen -F` reads hashed entries, which is what `ssh-keyscan -H`
          # writes, so it is the honest way to ask "is this host pinned?" -- and
          # the only way to check that a scan produced something usable.
          pinned() {
            ssh-keygen -F "$1" -f "$HOME/.ssh/known_hosts" > /dev/null 2>&1 ||
              ssh-keygen -F "[$1]:$2" -f "$HOME/.ssh/known_hosts" > /dev/null 2>&1
          }

          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          fi

          # The jump host's key is scanned directly and verified before it can be
          # used: ssh-keyscan exits 0 having printed nothing when a responder
          # answers without a key, so `|| true` is only safe because of `pinned`.
          # An unreachable jump host is fatal only when the operator asked for the
          # jump; otherwise the mirror may still be reachable on its own.
          if [ "$jumpable" = true ] && ! pinned "${PRIMARY_TARGET#*@}" "$PRIMARY_PORT"; then
            ssh-keyscan -T 10 -p "$PRIMARY_PORT" -H "${PRIMARY_TARGET#*@}" \
              >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            if pinned "${PRIMARY_TARGET#*@}" "$PRIMARY_PORT"; then
              echo "jump host ${PRIMARY_TARGET#*@} pinned on port $PRIMARY_PORT"
            elif [ "$mode" = jump ]; then
              fail "could not learn the host key of ${PRIMARY_TARGET#*@} on port $PRIMARY_PORT, the jump host: pin it in TESTNET_KNOWN_HOSTS, or check that it still accepts SSH from GitHub runners"
            else
              echo "::notice::could not read the jump host's key; trying a direct connection to the mirror"
              jumpable=false
            fi
          fi

          # The mirror's key is scanned even when a pinned file was supplied. It
          # has to be: EDGE_KNOWN_HOSTS falls back to TESTNET_KNOWN_HOSTS, which
          # pins the *primary*, so it cannot contain the mirror's key and
          # `StrictHostKeyChecking yes` would refuse the one host being deployed.
          # A deliberate EDGE_KNOWN_HOSTS is a different thing: it was written for
          # this host, so a pin there means the probes are unnecessary.
          mirror_pinned=false
          if [ -n "${EDGE_PIN:-}" ] && pinned "$edge_host" "$DEPLOY_PORT"; then
            echo "the mirror's host key is pinned in EDGE_KNOWN_HOSTS"
            mirror_pinned=true
          fi

          # Jump first: that route needs no public port on the mirror at all. The
          # direct scan is the fallback for a runner that can reach the host
          # itself. Both are verified, neither is trusted.
          route=""
          if [ "$mirror_pinned" = false ] && [ "$jumpable" = true ]; then
            ssh primary "ssh-keyscan -p $DEPLOY_PORT -H '$edge_host'" \
              >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            if pinned "$edge_host" "$DEPLOY_PORT"; then route=jump; fi
          fi
          if [ -z "$route" ] && [ "$mirror_pinned" = false ] && [ "$mode" != jump ]; then
            ssh-keyscan -T 10 -p "$DEPLOY_PORT" -H "$edge_host" \
              >> "$HOME/.ssh/known_hosts" 2>/dev/null || true
            if pinned "$edge_host" "$DEPLOY_PORT"; then route=direct; fi
          fi
          if [ -z "$route" ] && [ "$mirror_pinned" = true ]; then
            # The key is known, so no probe can pick the transport: use the route
            # the repository documents whenever it is available.
            if [ "$jumpable" = true ]; then route=jump; else route=direct; fi
          fi
          if [ -z "$route" ]; then
            if [ "$mode" = jump ]; then
              fail "could not read the host key of $edge_host on port $DEPLOY_PORT through ${PRIMARY_TARGET#*@}: EDGE_DEPLOY_HOST must be the mirror's internal address when the runner has no route of its own (gcloud compute instances describe <edge> --format='value(networkInterfaces[0].networkIP)'), the sccp-edge-ssh-from-primary rule must allow the primary's network tag, and the deploy key must be authorized on the mirror (deploy/edge/README.md)"
            elif [ "$jumpable" = true ]; then
              fail "no host key from $edge_host:$DEPLOY_PORT, through ${PRIMARY_TARGET#*@} or directly: if the mirror's SSH is open only to the VPC, EDGE_DEPLOY_HOST must be its internal address and sccp-edge-ssh-from-primary must allow the primary's tag (deploy/edge/README.md); if it is open to the runner, pin its key in secrets.EDGE_KNOWN_HOSTS; a host that accepts TCP but never speaks is a mirror problem, not a key problem"
            else
              fail "no host key from $edge_host:$DEPLOY_PORT: the mirror has no public SSH by design, so set vars.TESTNET_DEPLOY_HOST so this job can jump through the primary, or pin its key in secrets.EDGE_KNOWN_HOSTS, or give the runner a route to it"
            fi
          fi

          if [ "$route" = jump ]; then
            host_block edge "$TARGET" "$DEPLOY_PORT" "$HOME/.ssh/id_edge" "ProxyJump primary"
          else
            host_block edge "$TARGET" "$DEPLOY_PORT" "$HOME/.ssh/id_edge" ""
          fi

          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
          if [ "$route" = jump ]; then
            echo "mirror: ${TARGET%%@*}@$edge_host:$DEPLOY_PORT -> $DOMAIN, data in $DEPLOY_DIR, jumped through ${PRIMARY_TARGET#*@}"
          else
            echo "mirror: ${TARGET%%@*}@$edge_host:$DEPLOY_PORT -> $DOMAIN, data in $DEPLOY_DIR, direct from this runner"
          fi

          # The host key proves identity, not authorization. A key that is not in
          # the mirror's authorized_keys used to surface as a bare scp failure two
          # steps later; one deliberate connect names the real cause here, and
          # separates a refused key from a route that never reached the host.
          ssh -o ConnectTimeout=15 edge true 2>/dev/null ||
            fail "the deploy key could not open a session on $edge_host as ${TARGET%%@*}: 'Permission denied' means the key is not in the mirror's ssh-keys metadata (deploy/edge/README.md); a timeout or 'Connection refused' means the $route route is wrong, and a host that accepts TCP on port $DEPLOY_PORT but never answers is unwell rather than misconfigured"

      # --- Ship the stack ------------------------------------------------------
      - name: Upload the Compose project
        if: steps.target.outputs.deploy == 'true'
        run: |
          set -eu
          ssh edge "mkdir -p '$DEPLOY_DIR'"
          scp deploy/edge/docker-compose.yml deploy/edge/Caddyfile edge:"$DEPLOY_DIR/"

      # Written rather than exported into every remote command: `.env` next to
      # docker-compose.yml is what an operator's manual run uses, so the two
      # paths deploy the same project with the same values.
      - name: Write .env on the mirror
        if: steps.target.outputs.deploy == 'true'
        run: |
          set -eu
          payload="$(printf 'SCCP_IMAGE=%s\nSCCP_EDGE_DOMAIN=%s\nSCCP_PRIMARY_URL=%s\n' \
            "$IMAGE" "$DOMAIN" "$PRIMARY_URL" | base64 | tr -d '\n')"
          ssh edge "printf '%s' '$payload' | base64 -d > '$DEPLOY_DIR/.env' \
            && chmod 600 '$DEPLOY_DIR/.env'"
          echo "mirror settings: $IMAGE -> https://$DOMAIN, replicating $PRIMARY_URL"

      - name: Pull the image and restart the stack
        if: steps.target.outputs.deploy == 'true'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          printf '%s' "$GHCR_TOKEN" |
            ssh edge "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # `--no-build` is not style: this VM is a 1 GB e2-micro with no source
          # tree, and falling back to a build there fails slowly and opaquely.
          ssh edge "cd '$DEPLOY_DIR' && docker compose pull node"

          # `up -d` on its own only proves the containers were created; `--wait`
          # also proves the node answers, and that distinction is the whole
          # reason this step can fail. The mirror replays its stored chain at
          # startup, so a build that moves a consensus parameter -- the 30 s
          # cadence doubled maturity, registration, dispute and beacon windows
          # -- makes the state root of blocks already on disk unreplayable. The
          # node exits, `tls` never starts behind its `service_healthy`
          # dependency, and `up` failed here, before the block-1 comparison
          # below could see anything.
          #
          # Only the node is waited on: a proxy that will not start must never
          # cost the chain, and the wipe below is for a node that cannot read
          # its own store. The rest of the project starts afterwards, as before.
          if ! ssh edge "cd '$DEPLOY_DIR' \
                && docker compose up -d --no-build --wait --wait-timeout 300 node"; then
            echo "::warning::the node did not become healthy on the chain it had stored"
            ssh edge "cd '$DEPLOY_DIR' && docker compose ps -a" || true
            ssh edge "cd '$DEPLOY_DIR' && docker compose logs --tail=40 --no-color node" || true

            # The store is a cache, not history: this mirror holds no keys and no
            # block the primary does not also have, so an unreadable one is thrown
            # away and one sync rebuilds it (docs/operations/MIRROR_OUTAGE.md).
            # Exactly once, so a genuinely broken image still fails the deploy
            # instead of wiping the volume on a loop.
            #
            # Only the node's own volume. A project-wide `down --volumes` would
            # take caddy_data with it and re-issue the certificate on every chain
            # reset, which is a Let's Encrypt rate limit away from an outage.
            ssh edge "cd '$DEPLOY_DIR' \
              && docker compose stop node \
              && docker compose run --rm --no-deps --entrypoint sh node -c 'rm -rf /data/*' \
              && docker compose up -d --no-build --wait --wait-timeout 300 node"
          fi
          ssh edge "cd '$DEPLOY_DIR' && docker compose up -d --no-build --remove-orphans"

      # A changed Caddyfile in a bind mount is not picked up by `up -d`, and
      # Caddy does not watch the file.
      - name: Reload the TLS terminator
        if: steps.target.outputs.deploy == 'true'
        run: |
          ssh edge "cd '$DEPLOY_DIR' \
            && (docker compose exec -T tls caddy reload \
                  --config /etc/caddy/Caddyfile --adapter caddyfile \
                || docker compose restart tls)"

      # The primary's redeploy is destructive: `docker compose down --volumes`
      # there starts a new chain from the same genesis. A mirror that had already
      # adopted the old chain would sit at a height the primary no longer has,
      # serving blocks nobody follows — and `sync_from` only ever asks for blocks
      # above its own height, so it would never notice on its own. Block 1 is
      # enough to tell: same genesis, different first block means different
      # chains.
      - name: Re-sync after a primary chain reset
        if: steps.target.outputs.deploy == 'true'
        run: |
          set -eu
          mirror="https://$DOMAIN"
          primary_height="$(curl -fsS "$PRIMARY_URL/v1/status" | jq -r .height)"
          if [ "$primary_height" -lt 1 ]; then
            echo "the primary is at height 0; there is nothing to compare"
            exit 0
          fi
          primary_block="$(curl -fsS "$PRIMARY_URL/v1/blocks/1" | jq -r .hash)"
          mirror_block="$(curl -sS --retry 6 --retry-delay 5 --retry-connrefused --max-time 20 \
            "$mirror/v1/blocks/1" | jq -r '.hash // empty' 2>/dev/null || true)"
          echo "primary block 1: $primary_block"
          echo "mirror  block 1: ${mirror_block:-<none>}"
          if [ -z "$mirror_block" ] || [ "$mirror_block" = "$primary_block" ]; then
            exit 0
          fi
          echo "the mirror holds a chain the primary discarded; resetting its data"
          # Only the node's own volume. A project-wide `down --volumes` would
          # take caddy_data with it and re-issue the certificate on every chain
          # reset, which is a Let's Encrypt rate limit away from an outage.
          ssh edge "cd '$DEPLOY_DIR' \
            && docker compose stop node \
            && docker compose run --rm --no-deps --entrypoint sh node -c 'rm -rf /data/*' \
            && docker compose up -d --no-build"

      # --- Prove it ------------------------------------------------------------
      # Three separate claims, because a 200 from the proxy proves none of them:
      # TLS and GET reach the node, writes are refused, and the replica adopted
      # the primary's chain after this deploy.
      - name: Smoke-test the mirror
        if: steps.target.outputs.deploy == 'true'
        run: |
          set -eu
          mirror="https://$DOMAIN"
          status="$(curl -fsS --retry 12 --retry-delay 5 --retry-connrefused --max-time 20 \
            "$mirror/v1/status")"
          echo "$status" | jq -e '.network == "testnet"' > /dev/null

          # The genesis hash is the strongest cheap claim: this is the same chain
          # as the primary, not a fresh bootstrap that happens to answer.
          remote_genesis="$(curl -fsS "$PRIMARY_URL/v1/status" | jq -r .genesis_hash)"
          local_genesis="$(echo "$status" | jq -r .genesis_hash)"
          echo "primary genesis: $remote_genesis"
          echo "mirror  genesis: $local_genesis"
          [ "$remote_genesis" = "$local_genesis" ] || {
            echo "::error::the mirror is serving a different chain than the primary"
            exit 1
          }

          code="$(curl -s -o /dev/null -w '%{http_code}' -X POST "$mirror/v1/tx" -d '{}')"
          echo "POST /v1/tx -> $code"
          [ "$code" = "405" ] || {
            echo "::error::the mirror accepted a write (POST /v1/tx -> $code); the proxy must be read-only"
            exit 1
          }

          allow="$(curl -s -o /dev/null -D - -X POST "$mirror/v1/tx" -d '{}' |
            tr -d '\r' | awk 'tolower($1) == "allow:" { $1=""; print }')"
          echo "Allow:$allow"
          echo "$allow" | grep -qi 'GET'

          # Pull-sync is not instant: the first poll is up to
          # SCCP_PEER_POLL_SECONDS away, so wait for the height this deploy saw
          # on the primary rather than for equality with a moving target.
          target="$(curl -fsS "$PRIMARY_URL/v1/status" | jq -r .height)"
          echo "waiting for the mirror to reach height $target"
          for attempt in $(seq 1 20); do
            height="$(curl -fsS "$mirror/v1/status" | jq -r .height)"
            echo "  attempt $attempt: mirror height $height"
            if [ "$height" -ge "$target" ]; then
              echo "mirror replicated past height $target"
              exit 0
            fi
            sleep 15
          done
          echo "::error::the mirror did not adopt the primary's chain"
          exit 1

      - name: Show the mirror state
        if: always() && steps.target.outputs.deploy == 'true'
        run: |
          ssh edge "cd '$DEPLOY_DIR' && docker compose ps" || true
          ssh edge "cd '$DEPLOY_DIR' && docker compose logs --tail=60 node tls" || true
