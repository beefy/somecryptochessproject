name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest --cov=sccp --cov-report=term-missing --cov-fail-under=85

      - name: Coverage gate (crypto and serialization >= 95%)
        run: pytest -q --cov=sccp.crypto --cov=sccp.serialization --cov-fail-under=95

  engine:
    name: stockfish smoke
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Fetch pinned Stockfish
        run: python scripts/fetch_engine.py --engine stockfish-19 --dest ./bin

      - name: Real-engine game
        env:
          SCCP_STOCKFISH: ./bin/stockfish-linux-x86-64-universal
        run: pytest -m engine tests/integration -q
