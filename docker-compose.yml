# The four-miner testnet deployment: one node, one relay, one bootstrap job, two
# standard miners, two Chess960 miners and the traffic generators that keep the
# chain in use. Each variant has its own pair, and the relay matches within a
# variant, so a round opens one standard and one Chess960 game.
# `deploy/bootstrap_testnet_stack.py` builds the funded, registered, matchable
# chain once; see deploy/README.md and docs/operations/RUNBOOK.md.
#
#   docker compose up --build
#   curl http://127.0.0.1:8645/v1/status
#   curl http://127.0.0.1:8646/v1/status
#
# SCCP_IMAGE selects the published image in CI; local runs build it. The deploy
# workflow always starts from empty volumes so the deterministic bootstrap can
# run; reset with `docker compose down -v` before changing the image.
name: sccp-testnet

x-sccp-service: &sccp-service
  image: ${SCCP_IMAGE:-sccp-testnet:local}
  build: .
  # Bounded logs. Every service here is `restart: unless-stopped` and can run for
  # weeks between deploys; the traffic generator also prints a line per cycle, so
  # an uncapped json-file driver grows until the 20 GB disk is full.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  init:
    <<: *sccp-service
    entrypoint: ["python", "/app/deploy/init_testnet_stack.py"]
    command: ["--out", "/stack"]
    environment:
      SCCP_STACK_PASSPHRASE: sccp-testnet-stack
    volumes:
      - stack:/stack
    restart: "no"

  node:
    <<: *sccp-service
    command:
      - --data-dir
      - /data
      - node
      - run
      - --network
      - testnet
      - --host
      - 0.0.0.0
      - --port
      - "8645"
      # Settle proofs the miners announce. The bootstrap chain is pre-built, so
      # the background miner must not also extend the empty bootstrap window.
      # Coinbases go to stack miner-1: a deterministic address derived by
      # `deploy/init_testnet_stack.py` from a published seed, so the value below
      # is fixed. It must be the version-1 form (the address commits to the
      # 1985-byte hybrid public key); `tests/unit/test_deploy_compose.py` pins it
      # against the address the init container writes, so a scheme change cannot
      # leave a stale literal here and take the whole stack down at boot.
      - --mine
      - --miner-address
      - sccpt1q87tje79rytrvlasq2g4g86c09yzalk3g4hlepzkz7p95hdlemdxgwqrd9g
      - --no-mine-bootstrap
      - --mine-poll-seconds
      - "1"
      # Pace blocks at the network's target spacing. A block's timestamp is the
      # wall clock and the difficulty retarget reads it: settling on every poll
      # makes the chain look far faster, so the schedule raises `wins_required`
      # past what the four-miner roster can win per epoch and the chain stops.
      # At one block per `target_block_seconds` the retarget is neutral.
      - --mine-interval-seconds
      - "30"
    # The bridge environment is testnet -> Sepolia. Leave these unset to keep
    # the bridge visible but disabled in the web UI; set them in the deploy
    # host's environment after deploying `contracts/EthHtlc.sol`.
    environment:
      SCCP_ETH_RPC_URL: ${SCCP_ETH_RPC_URL:-}
      SCCP_ETH_HTLC_CONTRACT: ${SCCP_ETH_HTLC_CONTRACT:-}
      SCCP_ETH_CONFIRMATIONS: ${SCCP_ETH_CONFIRMATIONS:-}
      SCCP_ETH_SCCP_MARGIN: ${SCCP_ETH_SCCP_MARGIN:-}
    ports:
      - "8645:8645"
    volumes:
      - node-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8645/v1/status', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  bootstrap:
    <<: *sccp-service
    entrypoint: ["python", "/app/deploy/bootstrap_testnet_stack.py"]
    command:
      - --stack
      - /stack
      - --node
      - http://node:8645
      - --engine-path
      - /usr/games/stockfish
    volumes:
      - stack:/stack
    depends_on:
      node:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *sccp-service
    entrypoint: ["python", "-m", "deploy.seed_testnet_demo"]
    command:
      - --stack
      - /stack
      - --node
      - http://node:8645
    # Testnet genesis already creates the SCCP/C960 pool and a completed SCCP
    # HTLC, so this normally just reports them. It remains the fallback creator
    # for a custom chain whose genesis does not seed those records.
    volumes:
      - stack:/stack
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: on-failure

  relay:
    <<: *sccp-service
    command:
      # The witness key is a wallet keyfile, so the relay needs the stack
      # passphrase the same way the miners do. Without it the process blocks on a
      # passphrase prompt that no container can answer.
      - --passphrase-file
      - /stack/passphrase
      - matchmaker
      - run
      - --network
      - testnet
      - --config
      - /stack/relay.json
      - --store
      - /stack/relay-state.json
      # Follow the chain: the config pins epoch 3, and the relay moves onto each
      # later epoch the chain opens, so proofs stay claimable past the bootstrap.
      - --node
      - http://node:8645
      - --node-poll-seconds
      - "2"
      - --host
      - 0.0.0.0
      - --port
      - "8646"
      # The relay is clock witness 1: it signs a receipt for every move it
      # accepts and a flag receipt when a clock runs out. Without this key its
      # receipts carry no signature, so a flagged game cannot become a bonded
      # timeout_claim and the timeout path is dead on the deployment. The key is
      # witness-1's, written by the init container from a published seed and
      # registered on chain by the bootstrap.
      - --witness-key
      - /stack/keys/witness-1.key
    ports:
      - "8646:8646"
    volumes:
      - stack:/stack
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8646/v1/status', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  # Clock witnesses 2 and 3. Each is an independent process with its own key: it
  # polls the relay, re-runs the protocol's clock verifier over the receipts and
  # publishes a bundle it signed itself. The testnet quorum is one, so any single
  # witness can settle a timeout; three means a claim survives two being down, and
  # it is the smallest set in which two conflicting signatures (equivocation) can
  # even exist for `slash_evidence` to punish. Neither service is published: they
  # are evidence sources for the miners inside the compose network, not a public
  # API.
  witness-2:
    <<: *sccp-service
    command:
      - --passphrase-file
      - /stack/passphrase
      - witness
      - run
      - --network
      - testnet
      - --key
      - /stack/keys/witness-2.key
      - --relay
      - http://relay:8646
      - --host
      - 0.0.0.0
      - --port
      - "8647"
      # The keys it verifies before adding its own signature: the relay's
      # (witness 1) and its peers'. `init` writes one file per witness, so no
      # 3 970-character hybrid key has to be pasted into this file.
      - --relay-witness-key-file
      - /stack/keys/witness-1.pub
      - --relay-witness-key-file
      - /stack/keys/witness-2.pub
      - --relay-witness-key-file
      - /stack/keys/witness-3.pub
      - --poll-seconds
      - "2"
    volumes:
      - stack:/stack
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8647/v1/status', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

  witness-3:
    <<: *sccp-service
    command:
      - --passphrase-file
      - /stack/passphrase
      - witness
      - run
      - --network
      - testnet
      - --key
      - /stack/keys/witness-3.key
      - --relay
      - http://relay:8646
      - --host
      - 0.0.0.0
      - --port
      - "8648"
      - --relay-witness-key-file
      - /stack/keys/witness-1.pub
      - --relay-witness-key-file
      - /stack/keys/witness-2.pub
      - --relay-witness-key-file
      - /stack/keys/witness-3.pub
      - --poll-seconds
      - "2"
    volumes:
      - stack:/stack
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8648/v1/status', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

  drip:
    <<: *sccp-service
    entrypoint: ["python", "/app/deploy/drip_testnet_traffic.py"]
    command:
      - --node
      - http://node:8645
      - --poll-seconds
      - "2"
    # Keep ledger work in the pool: an epoch is five blocks but the roster only
    # generates four availability/reveal transactions, so an epoch without a
    # decisive game would run one block short and stop the chain. See
    # deploy/README.md.
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  traffic:
    <<: *sccp-service
    entrypoint: ["python", "/app/deploy/synthetic_testnet_traffic.py"]
    command:
      - --node
      - http://node:8645
      - --relay
      - http://relay:8646
      # Ordinary wallet usage on top of the drip: it creates ten wallets and funds
      # them, then each cycle picks 2-10, tops up the short ones, sends 1-10 transfers
      # between them and waits for both phases to be mined, then idles for 1-5
      # minutes. It holds no roster slot and builds no blocks; the node admits every
      # transfer like any wallet's.
      #
      # Every twelfth cycle it also fires a burst (80 transfers in five one-second
      # waves, after topping the pool up with the operator key) so a deep mempool
      # and several blocks of backlog are exercised; `--burst-every 0` disables it.
      #
      # It also seats the two extra miners, with fixed roles rather than a churn:
      # `synthetic-miner-1` is deliberately slow, so its clock really runs out,
      # the winning seat submits a bonded timeout_claim, and the timeout path
      # runs against live evidence; `synthetic-miner-2` plays GNU Chess, so the
      # roster is not one engine six times. `host_capacity` budgets both against
      # this VM (two vCPUs after the node, the relay and the three witnesses are
      # reserved); `--no-extra-miner-churn`
      # keeps them online so their identities are stable from round to round.
      #
      # It runs beside the miners rather than on its own VM because its lifetime is
      # the chain's: the deploy starts from empty volumes, so a generator that
      # outlived `docker compose down -v` would send with stale nonces and balances.
      - --extra-miners
      - "2"
      - --max-extra-online
      - "2"
      - --no-extra-miner-churn
      # The clock witnesses the extra seats trust, so a flag on a game they played
      # can become a claim, and the two independent witness services as fallback
      # evidence sources.
      - --witness-key-file
      - /stack/keys/witness-1.pub
      - --witness-key-file
      - /stack/keys/witness-2.pub
      - --witness-key-file
      - /stack/keys/witness-3.pub
      - --witness-url
      - http://witness-2:8647
      - --witness-url
      - http://witness-3:8648
    volumes:
      - stack:/stack
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      witness-2:
        condition: service_healthy
      witness-3:
        condition: service_healthy
    restart: unless-stopped

  miner-1:
    <<: *sccp-service
    command:
      - --passphrase-file
      - /stack/passphrase
      - miner
      - run
      - --network
      - testnet
      - --key
      - /stack/keys/miner-1.key
      - --variant
      - standard
      # Keeps the miner on the roster: it commits availability two epochs ahead
      # and reveals every epoch, so the chain keeps finding proofs after the
      # bootstrap's own reveals run out.
      - --nonce-secret-file
      - /stack/keys/miner-1.nonce
      - --engine-profile
      - stockfish-19
      - --engine-path
      - /usr/games/stockfish
      # Testnet only: a 5k-node search keeps games fast enough for a demo.
      - --nodes-per-move
      - "5000"
      # Testnet only: resign on our own turn after 60 plies. Two engines of equal
      # strength draw long games, and a draw carries no proof, so without this
      # policy an epoch with no decisive game has nothing to settle.
      - --resign-after-plies
      - "60"
      - --relay
      - http://relay:8646
      - --node
      - http://node:8645
      # A flag this miner wins becomes a signed timeout_claim sent to the node,
      # and the matching time_forfeit proof is queued until the claim matures.
      # This is the CLI default; spelling it here makes the deployment's intent
      # explicit and survives a future default change.
      - --submit-timeout-claims
      # Trust all three clock witnesses. Without their keys a flagged game cannot
      # become a bonded timeout claim, because the flag receipt has nothing to be
      # verified against. The witness URLs are the fallback evidence source for
      # the case the relay itself has no bundle.
      - --relay-witness-key-file
      - /stack/keys/witness-1.pub
      - --relay-witness-key-file
      - /stack/keys/witness-2.pub
      - --relay-witness-key-file
      - /stack/keys/witness-3.pub
      - --witness-url
      - http://witness-2:8647
      - --witness-url
      - http://witness-3:8648
      # 0.5s rather than 0.1s: six seats share two vCPUs with the node, the
      # relay, three witnesses and the traffic generator, and polling is what
      # those seats actually cost when a search is milliseconds long.
      - --poll-seconds
      - "0.5"
    volumes:
      - stack:/stack
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

  miner-2:
    <<: *sccp-service
    command:
      - --passphrase-file
      - /stack/passphrase
      - miner
      - run
      - --network
      - testnet
      - --key
      - /stack/keys/miner-2.key
      - --variant
      - standard
      - --nonce-secret-file
      - /stack/keys/miner-2.nonce
      - --engine-profile
      - stockfish-19
      - --engine-path
      - /usr/games/stockfish
      - --nodes-per-move
      - "5000"
      # Testnet only: resign on our own turn after 60 plies (see miner-1).
      - --resign-after-plies
      - "60"
      - --relay
      - http://relay:8646
      - --node
      - http://node:8645
      # A flag this miner wins becomes a signed timeout_claim sent to the node,
      # and the matching time_forfeit proof is queued until the claim matures.
      # This is the CLI default; spelling it here makes the deployment's intent
      # explicit and survives a future default change.
      - --submit-timeout-claims
      # Trust all three clock witnesses. Without their keys a flagged game cannot
      # become a bonded timeout claim, because the flag receipt has nothing to be
      # verified against. The witness URLs are the fallback evidence source for
      # the case the relay itself has no bundle.
      - --relay-witness-key-file
      - /stack/keys/witness-1.pub
      - --relay-witness-key-file
      - /stack/keys/witness-2.pub
      - --relay-witness-key-file
      - /stack/keys/witness-3.pub
      - --witness-url
      - http://witness-2:8647
      - --witness-url
      - http://witness-3:8648
      # 0.5s rather than 0.1s: six seats share two vCPUs with the node, the
      # relay, three witnesses and the traffic generator, and polling is what
      # those seats actually cost when a search is milliseconds long.
      - --poll-seconds
      - "0.5"
    volumes:
      - stack:/stack
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

  # The Chess960 pair. Stockfish runs with UCI_Chess960 because the miner passes
  # --variant chess960 to open_engine; python-chess turns the option on from each
  # board (it owns the option), and the relay selects the start position from the
  # epoch beacon, so both seats rebuild the same board from the certificate.
  miner-3:
    <<: *sccp-service
    command:
      - --passphrase-file
      - /stack/passphrase
      - miner
      - run
      - --network
      - testnet
      - --key
      - /stack/keys/miner-3.key
      - --variant
      - chess960
      - --nonce-secret-file
      - /stack/keys/miner-3.nonce
      - --engine-profile
      - stockfish-19
      - --engine-path
      - /usr/games/stockfish
      - --nodes-per-move
      - "5000"
      - --resign-after-plies
      - "60"
      - --relay
      - http://relay:8646
      - --node
      - http://node:8645
      # A flag this miner wins becomes a signed timeout_claim sent to the node,
      # and the matching time_forfeit proof is queued until the claim matures.
      # This is the CLI default; spelling it here makes the deployment's intent
      # explicit and survives a future default change.
      - --submit-timeout-claims
      # Trust all three clock witnesses. Without their keys a flagged game cannot
      # become a bonded timeout claim, because the flag receipt has nothing to be
      # verified against. The witness URLs are the fallback evidence source for
      # the case the relay itself has no bundle.
      - --relay-witness-key-file
      - /stack/keys/witness-1.pub
      - --relay-witness-key-file
      - /stack/keys/witness-2.pub
      - --relay-witness-key-file
      - /stack/keys/witness-3.pub
      - --witness-url
      - http://witness-2:8647
      - --witness-url
      - http://witness-3:8648
      # 0.5s rather than 0.1s: six seats share two vCPUs with the node, the
      # relay, three witnesses and the traffic generator, and polling is what
      # those seats actually cost when a search is milliseconds long.
      - --poll-seconds
      - "0.5"
    volumes:
      - stack:/stack
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

  miner-4:
    <<: *sccp-service
    command:
      - --passphrase-file
      - /stack/passphrase
      - miner
      - run
      - --network
      - testnet
      - --key
      - /stack/keys/miner-4.key
      - --variant
      - chess960
      - --nonce-secret-file
      - /stack/keys/miner-4.nonce
      - --engine-profile
      - stockfish-19
      - --engine-path
      - /usr/games/stockfish
      - --nodes-per-move
      - "5000"
      - --resign-after-plies
      - "60"
      - --relay
      - http://relay:8646
      - --node
      - http://node:8645
      # A flag this miner wins becomes a signed timeout_claim sent to the node,
      # and the matching time_forfeit proof is queued until the claim matures.
      # This is the CLI default; spelling it here makes the deployment's intent
      # explicit and survives a future default change.
      - --submit-timeout-claims
      # Trust all three clock witnesses. Without their keys a flagged game cannot
      # become a bonded timeout claim, because the flag receipt has nothing to be
      # verified against. The witness URLs are the fallback evidence source for
      # the case the relay itself has no bundle.
      - --relay-witness-key-file
      - /stack/keys/witness-1.pub
      - --relay-witness-key-file
      - /stack/keys/witness-2.pub
      - --relay-witness-key-file
      - /stack/keys/witness-3.pub
      - --witness-url
      - http://witness-2:8647
      - --witness-url
      - http://witness-3:8648
      # 0.5s rather than 0.1s: six seats share two vCPUs with the node, the
      # relay, three witnesses and the traffic generator, and polling is what
      # those seats actually cost when a search is milliseconds long.
      - --poll-seconds
      - "0.5"
    volumes:
      - stack:/stack
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stack:
  node-data:
