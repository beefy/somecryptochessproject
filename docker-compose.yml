# The two-miner testnet deployment: one node, one relay, one bootstrap job, two
# miners and the two traffic generators that keep the chain in use.
# `deploy/bootstrap_testnet_stack.py` builds the funded, registered, matchable
# chain once; see deploy/README.md and docs/RUNBOOK.md.
#
#   docker compose up --build
#   curl http://127.0.0.1:8645/v1/status
#   curl http://127.0.0.1:8646/v1/status
#
# SCCP_IMAGE selects the published image in CI; local runs build it. The deploy
# workflow always starts from empty volumes so the deterministic bootstrap can
# run; reset with `docker compose down -v` before changing the image.
name: sccp-testnet

x-sccp-service: &sccp-service
  image: ${SCCP_IMAGE:-sccp-testnet:local}
  build: .
  # Bounded logs. Every service here is `restart: unless-stopped` and can run for
  # weeks between deploys; the traffic generator also prints a line per cycle, so
  # an uncapped json-file driver grows until the 20 GB disk is full.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  init:
    <<: *sccp-service
    entrypoint: ["python", "/app/deploy/init_testnet_stack.py"]
    command: ["--out", "/stack"]
    environment:
      SCCP_STACK_PASSPHRASE: sccp-testnet-stack
    volumes:
      - stack:/stack
    restart: "no"

  node:
    <<: *sccp-service
    command:
      - --data-dir
      - /data
      - node
      - run
      - --network
      - testnet
      - --host
      - 0.0.0.0
      - --port
      - "8645"
      # Settle proofs the miners announce. The bootstrap chain is pre-built, so
      # the background miner must not also extend the empty bootstrap window.
      # Coinbases go to stack miner-1: a deterministic address derived by
      # `deploy/init_testnet_stack.py` from a published seed, so the value below
      # is fixed. It must be the version-1 form (the address commits to the
      # 1985-byte hybrid public key); `tests/unit/test_deploy_compose.py` pins it
      # against the address the init container writes, so a scheme change cannot
      # leave a stale literal here and take the whole stack down at boot.
      - --mine
      - --miner-address
      - sccpt1q87tje79rytrvlasq2g4g86c09yzalk3g4hlepzkz7p95hdlemdxgwqrd9g
      - --no-mine-bootstrap
      - --mine-poll-seconds
      - "2"
      # Pace blocks at the network's target spacing. A block's timestamp is the
      # wall clock and the difficulty retarget reads it: settling on every 2s
      # poll makes the chain look 30x too fast, so the schedule raises
      # `wins_required` past what a two-miner roster can win per epoch and the
      # chain stops. At one block per `target_block_seconds` the retarget is
      # neutral.
      - --mine-interval-seconds
      - "60"
    ports:
      - "8645:8645"
    volumes:
      - node-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8645/v1/status', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  bootstrap:
    <<: *sccp-service
    entrypoint: ["python", "/app/deploy/bootstrap_testnet_stack.py"]
    command:
      - --stack
      - /stack
      - --node
      - http://node:8645
      - --engine-path
      - /usr/games/stockfish
    volumes:
      - stack:/stack
    depends_on:
      node:
        condition: service_healthy
    restart: "no"

  relay:
    <<: *sccp-service
    command:
      - matchmaker
      - run
      - --network
      - testnet
      - --config
      - /stack/relay.json
      - --store
      - /stack/relay-state.json
      # Follow the chain: the config pins epoch 3, and the relay moves onto each
      # later epoch the chain opens, so proofs stay claimable past the bootstrap.
      - --node
      - http://node:8645
      - --node-poll-seconds
      - "2"
      - --host
      - 0.0.0.0
      - --port
      - "8646"
    ports:
      - "8646:8646"
    volumes:
      - stack:/stack
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8646/v1/status', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  drip:
    <<: *sccp-service
    entrypoint: ["python", "/app/deploy/drip_testnet_traffic.py"]
    command:
      - --node
      - http://node:8645
      - --poll-seconds
      - "2"
    # Keep ledger work in the pool: an epoch is five blocks but the roster only
    # generates four availability/reveal transactions, so an epoch without a
    # decisive game would run one block short and stop the chain. See
    # deploy/README.md.
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  traffic:
    <<: *sccp-service
    entrypoint: ["python", "/app/deploy/synthetic_testnet_traffic.py"]
    command:
      - --node
      - http://node:8645
    # Ordinary wallet usage on top of the drip: it creates ten wallets and funds
    # them, then each cycle picks 2-10, tops up the short ones, sends 1-10 transfers
    # between them and waits for both phases to be mined, then idles for 1-5
    # minutes. It holds no roster slot and builds no blocks; the node admits every
    # transfer like any wallet's.
    #
    # It runs beside the miners rather than on its own VM because its lifetime is
    # the chain's: the deploy starts from empty volumes, so a generator that
    # outlived `docker compose down -v` would send with stale nonces and balances.
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  miner-1:
    <<: *sccp-service
    command:
      - --passphrase-file
      - /stack/passphrase
      - miner
      - run
      - --network
      - testnet
      - --key
      - /stack/keys/miner-1.key
      # Keeps the miner on the roster: it commits availability two epochs ahead
      # and reveals every epoch, so the chain keeps finding proofs after the
      # bootstrap's own reveals run out.
      - --nonce-secret-file
      - /stack/keys/miner-1.nonce
      - --engine-profile
      - stockfish-19
      - --engine-path
      - /usr/games/stockfish
      # Testnet only: a 5k-node search keeps games fast enough for a demo.
      - --nodes-per-move
      - "5000"
      # Testnet only: resign on our own turn after 60 plies. Two engines of equal
      # strength draw long games, and a draw carries no proof, so without this
      # policy an epoch with no decisive game has nothing to settle.
      - --resign-after-plies
      - "60"
      - --relay
      - http://relay:8646
      - --node
      - http://node:8645
      - --poll-seconds
      - "0.1"
    volumes:
      - stack:/stack
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

  miner-2:
    <<: *sccp-service
    command:
      - --passphrase-file
      - /stack/passphrase
      - miner
      - run
      - --network
      - testnet
      - --key
      - /stack/keys/miner-2.key
      - --nonce-secret-file
      - /stack/keys/miner-2.nonce
      - --engine-profile
      - stockfish-19
      - --engine-path
      - /usr/games/stockfish
      - --nodes-per-move
      - "5000"
      # Testnet only: resign on our own turn after 60 plies (see miner-1).
      - --resign-after-plies
      - "60"
      - --relay
      - http://relay:8646
      - --node
      - http://node:8645
      - --poll-seconds
      - "0.1"
    volumes:
      - stack:/stack
    depends_on:
      relay:
        condition: service_healthy
    restart: unless-stopped

volumes:
  stack:
  node-data:
